name: Frontend tests
on:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'package*.json', '.github/workflows/frontend.yaml']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --force
      - run: npm run test:frontend -- --run
