name: Build and publish Nefex images

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md', 'LICENSE*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: ${{ matrix.variant }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            variant: cpu
            base: ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
          - arch: arm64
            runner: ubuntu-24.04-arm
            variant: cpu
            base: ghcr.io/open-webui/open-webui:v0.12.3@sha256:a537bbe1e6b428820f52ed4a029d7fff97062e24d5cf32c365fba36fd0542def
          - arch: amd64
            runner: ubuntu-latest
            variant: cuda
            base: ghcr.io/open-webui/open-webui:v0.12.3-cuda@sha256:99e6fbec4cc2dd161b982c862b29a2748dec3bddd956d2e60a167b574919dc9a
    steps:
      - uses: actions/checkout@v5
      - name: Prepare image names and disk
        shell: bash
        run: |
          echo "APP_IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "MINIO_IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}-minio" >> "$GITHUB_ENV"
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Installer regression tests
        run: python -m unittest discover -s scripts/tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build changed application on the official runtime
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.APP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            WEBUI_BASE_IMAGE=${{ matrix.base }}
            BUILD_HASH=${{ github.sha }}
            BUILD_CHANNEL=${{ github.ref_type == 'tag' && 'main' || github.ref_name }}
            BUILD_NODE_OPTIONS=--max-old-space-size=12288
          cache-from: type=gha,scope=app-${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: ${{ matrix.variant == 'cpu' && format('type=gha,mode=max,scope=app-cpu-{0},timeout=2m,ignore-error=true', matrix.arch) || '' }}
      - name: Verify application image
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          docker run --rm --entrypoint python \
            -e WEBUI_SECRET_KEY=ci-isolated-test-key \
            -v "$PWD/backend/tests:/tests:ro" \
            "${APP_IMAGE}@${APP_DIGEST}" \
            -m unittest discover -s /tests -p 'test_*.py' -v
          docker run --rm --entrypoint sh "${APP_IMAGE}@${APP_DIGEST}" -ec \
            'test ! -f /app/backend/open_webui/routers/ollama.py; test -f /app/build/pyodide/pyodide.mjs'
      - name: Build patched MinIO release
        if: matrix.variant == 'cpu'
        id: minio
        uses: docker/build-push-action@v6
        with:
          context: deploy/minio
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.MINIO_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=minio-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=minio-${{ matrix.arch }},timeout=2m,ignore-error=true
      - name: Export verified digests
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          MINIO_DIGEST: ${{ steps.minio.outputs.digest }}
        run: |
          mkdir -p digests/app-${{ matrix.variant }} digests/minio
          touch "digests/app-${{ matrix.variant }}/${APP_DIGEST#sha256:}"
          if [ -n "$MINIO_DIGEST" ]; then
            touch "digests/minio/${MINIO_DIGEST#sha256:}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: digests
          retention-days: 7

  publish:
    name: Publish verified manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish and inspect multi-architecture images
        shell: bash
        run: |
          app="ghcr.io/${GITHUB_REPOSITORY,,}"
          minio="${app}-minio"
          short="${GITHUB_SHA:0:7}"
          refs=()
          for digest in digests/app-cpu/*; do refs+=("${app}@sha256:$(basename "$digest")"); done
          tags=(-t "$app:latest" -t "$app:main" -t "$app:git-$short")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=(-t "$app:$GITHUB_REF_NAME"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          refs=()
          for digest in digests/app-cuda/*; do refs+=("${app}@sha256:$(basename "$digest")"); done
          tags=(-t "$app:cuda" -t "$app:git-$short-cuda")
          if [ "$GITHUB_REF_TYPE" = tag ]; then tags+=(-t "$app:${GITHUB_REF_NAME}-cuda"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
          refs=()
          for digest in digests/minio/*; do refs+=("${minio}@sha256:$(basename "$digest")"); done
          docker buildx imagetools create -t "$minio:latest" -t "$minio:RELEASE.2025-10-15T17-29-55Z" "${refs[@]}"
          docker buildx imagetools inspect "$app:latest"
          docker buildx imagetools inspect "$app:cuda"
          docker buildx imagetools inspect "$minio:RELEASE.2025-10-15T17-29-55Z"
