name: ${COMPOSE_PROJECT_NAME:-nefex-web-ui}

x-app: &app
  image: ${WEBUI_IMAGE:-ghcr.io/albert-li-sz/nefex-web-ui:latest}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      BUILD_HASH: ${BUILD_HASH:-local}
      BUILD_CHANNEL: custom
      BUILD_NODE_OPTIONS: ${BUILD_NODE_OPTIONS:---max-old-space-size=6144}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:0.8.7-pg17-bookworm}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-webui}
      POSTGRES_USER: ${POSTGRES_USER:-webui}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/install-docker.sh first}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499}
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run scripts/install-docker.sh first}
    command:
      ['/bin/sh', '-ec', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: ${MINIO_IMAGE:-ghcr.io/albert-li-sz/nefex-web-ui-minio:RELEASE.2025-10-15T17-29-55Z}
    build:
      context: deploy/minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-webui-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run scripts/install-docker.sh first}
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - minio:/data
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  minio-init:
    <<: *app
    restart: 'no'
    entrypoint: ['python', '/app/backend/init_storage.py']
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-webui-admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/install-docker.sh first}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-webui}
      S3_REGION_NAME: us-east-1
    depends_on:
      minio:
        condition: service_healthy

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng@sha256:3619192d55f19eaec4b01892bdf10f80c67e8592fafd14b26ca504e52229210f}
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Run scripts/install-docker.sh first}
      SEARXNG_VALKEY_URL: valkey://:${REDIS_PASSWORD:?Run scripts/install-docker.sh first}@redis:6379/1
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng:/var/cache/searxng
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"
        ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  open-webui:
    <<: *app
    env_file:
      - ${WEBUI_ENV_FILE:-.env}
    restart: unless-stopped
    ports:
      - ${WEBUI_BIND_ADDRESS:-0.0.0.0}:${OPEN_WEBUI_PORT:-3000}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      WEBUI_NAME: ${WEBUI_NAME:-Nefex Web UI}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?Run scripts/install-docker.sh first}
      WEBUI_URL: ${WEBUI_URL:-http://localhost:3000}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-${WEBUI_URL:-http://localhost:3000}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-webui}:${POSTGRES_PASSWORD:?Run scripts/install-docker.sh first}@postgres:5432/${POSTGRES_DB:-webui}
      VECTOR_DB: pgvector
      PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH: ${PGVECTOR_INITIALIZE_MAX_VECTOR_LENGTH:-384}
      STORAGE_PROVIDER: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-webui-admin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Run scripts/install-docker.sh first}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-webui}
      S3_REGION_NAME: us-east-1
      S3_ADDRESSING_STYLE: path
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run scripts/install-docker.sh first}@redis:6379/0
      WEBSOCKET_MANAGER: redis
      WEBSOCKET_REDIS_URL: redis://:${REDIS_PASSWORD:?Run scripts/install-docker.sh first}@redis:6379/0
      ENABLE_OPENAI_API: 'true'
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENABLE_WEB_SEARCH: 'true'
      WEB_SEARCH_ENGINE: searxng
      SEARXNG_QUERY_URL: http://searxng:8080/search
      WEB_SEARCH_RESULT_COUNT: ${WEB_SEARCH_RESULT_COUNT:-5}
      WEB_LOADER_ENGINE: playwright
      RAG_EMBEDDING_ENGINE: ${RAG_EMBEDDING_ENGINE:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
      RAG_EMBEDDING_MODEL_AUTO_UPDATE: ${RAG_EMBEDDING_MODEL_AUTO_UPDATE:-false}
      RAG_OPENAI_API_BASE_URL: ${RAG_OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      RAG_OPENAI_API_KEY: ${RAG_OPENAI_API_KEY:-}
      ENABLE_CHANNELS: 'true'
      ENABLE_NOTES: 'true'
      ENABLE_MEMORIES: 'true'
      ENABLE_CODE_EXECUTION: 'true'
      ENABLE_CODE_INTERPRETER: 'true'
      ENABLE_PLUGINS: 'true'
      ENABLE_TOOLS: 'true'
      ENABLE_FUNCTIONS: 'true'
      ENABLE_TOOL_SERVERS: 'true'
      AUDIO_STT_ENGINE: ${AUDIO_STT_ENGINE:-}
      AUDIO_STT_OPENAI_API_BASE_URL: ${AUDIO_STT_OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      AUDIO_STT_OPENAI_API_KEY: ${AUDIO_STT_OPENAI_API_KEY:-}
      AUDIO_TTS_ENGINE: ${AUDIO_TTS_ENGINE:-}
      AUDIO_TTS_OPENAI_API_BASE_URL: ${AUDIO_TTS_OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      AUDIO_TTS_OPENAI_API_KEY: ${AUDIO_TTS_OPENAI_API_KEY:-}
      ENABLE_IMAGE_GENERATION: ${ENABLE_IMAGE_GENERATION:-false}
      IMAGE_GENERATION_ENGINE: ${IMAGE_GENERATION_ENGINE:-openai}
      IMAGES_OPENAI_API_BASE_URL: ${IMAGES_OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      IMAGES_OPENAI_API_KEY: ${IMAGES_OPENAI_API_KEY:-}
      ENABLE_IMAGE_EDIT: ${ENABLE_IMAGE_EDIT:-false}
      IMAGE_EDIT_ENGINE: ${IMAGE_EDIT_ENGINE:-openai}
      IMAGES_EDIT_OPENAI_API_BASE_URL: ${IMAGES_EDIT_OPENAI_API_BASE_URL:-https://api.openai.com/v1}
      IMAGES_EDIT_OPENAI_API_KEY: ${IMAGES_EDIT_OPENAI_API_KEY:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      SCARF_NO_ANALYTICS: 'true'
      DO_NOT_TRACK: 'true'
      ANONYMIZED_TELEMETRY: 'false'
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      searxng:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8080/health', timeout=5))['status']; assert json.load(urllib.request.urlopen('http://localhost:8080/health/db', timeout=5))['status']"
        ]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 120s

volumes:
  postgres:
  redis:
  minio:
  searxng:
  open-webui:
